version: '3'
vars:
  DEFAULT_PHP_VERSION: "8.4"
tasks:
  build:
    vars:
      PHP_VERSION: '{{default .DEFAULT_PHP_VERSION .PHP_VERSION}}'
    cmds:
      - docker build --build-arg PHP_VERSION={{.PHP_VERSION}} -t cc:{{.PHP_VERSION}} .
  build:*:
    vars:
      PHP_VERSION: '{{index .MATCH 0}}'
    cmds:
      - task: build
        vars: { PHP_VERSION: "{{.PHP_VERSION}}" } 
    silent: true

  ssh:
    vars:
      COMMAND: '{{default "bash" .COMMAND}}'
      PHP_VERSION: '{{default .DEFAULT_PHP_VERSION .PHP_VERSION}}'
    cmds:
      - echo "Running command {{.COMMAND}} on PHP {{.PHP_VERSION}}"
      - docker run --rm -it -v $(pwd):/app cc:{{.PHP_VERSION}} {{.COMMAND}}
  ssh:*:
    vars:
      PHP_VERSION: '{{index .MATCH 0}}'
    cmds:
      - task: ssh
        vars: { PHP_VERSION: "{{.PHP_VERSION}}" }
    silent: true

  exec:
    vars:
      PHP_VERSION: '{{default .DEFAULT_PHP_VERSION .PHP_VERSION}}'
    cmds:
      - docker run --rm -it -v $(pwd):/app cc:{{.PHP_VERSION}} bash
  exec:*:
    vars:
      PHP_VERSION: '{{index .MATCH 0}}'
    cmds:
      - task: exec
        vars: { PHP_VERSION: "{{.PHP_VERSION}}" }
    silent: true

  setup:*:
    vars:
      PHP_VERSION: '{{index .MATCH 0}}'
    cmds:
      - rm -f composer.lock 2> /dev/null
      - task: ssh
        vars: { COMMAND: "composer install", PHP_VERSION: "{{.PHP_VERSION}}" } 

  test:*:
    vars:
      PHP_VERSION: '{{index .MATCH 0}}'
    cmds:
      - task: build
        vars: { PHP_VERSION: "{{.PHP_VERSION}}" }
      - task: ssh
        vars: { COMMAND: "test", PHP_VERSION: "{{.PHP_VERSION}}" }
      - task: ssh
        vars: { COMMAND: "phpcs", PHP_VERSION: "{{.PHP_VERSION}}" }
  test:all:
    cmds:
        - |
          VERSIONS=("7.4" "8.0" "8.1" "8.2" "8.3" "8.4")
          for VERSION in "${VERSIONS[@]}"; do
            task build:$VERSION
            task setup:$VERSION
            task test:$VERSION
          done
          cat ./tmp/coverage.txt
  test:cs:
    cmds:
      - task: ssh
        vars: { COMMAND: "composer phpcs" }

  # Cleanup docker images
  cleanup:
    cmds:
      - |
        VERSIONS=("7.4" "8.0" "8.1" "8.2" "8.3" "8.4")
        for VERSION in "${VERSIONS[@]}"; do
          docker rmi -f cc:$VERSION
        done
  # Node JS Stuff
  watch:
    cmds:
      - npx tsc -w
